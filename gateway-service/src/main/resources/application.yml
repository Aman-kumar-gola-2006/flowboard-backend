spring:
  application:
    name: gateway-service
  datasource:
    url: jdbc:mysql://localhost:3306/flowboard_gateway?createDatabaseIfNotExist=true
    username: root
    password: 05092006
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        - id: auth-service-api
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**, /api/admin/**
        - id: auth-service-oauth2
          uri: http://auth-service:8081
          predicates:
            - Path=/oauth2/**, /login/**
        - id: workspace-service
          uri: http://workspace-service:8082
          predicates:
            - Path=/api/workspaces/**
          filters:
            - Authentication
        - id: board-service
          uri: http://board-service:8083
          predicates:
            - Path=/api/boards/**
          filters:
            - Authentication
        - id: list-service
          uri: http://list-service:8084
          predicates:
            - Path=/api/lists/**
          filters:
            - Authentication
        - id: card-service
          uri: http://card-service:8085
          predicates:
            - Path=/api/cards/**
          filters:
            - Authentication
        - id: comment-service
          uri: http://comment-service:8086
          predicates:
            - Path=/api/comments/**
          filters:
            - Authentication
        - id: label-service
          uri: http://board-service:8083
          predicates:
            - Path=/api/labels/**
          filters:
            - Authentication
        - id: notification-service
          uri: http://notification-service:8087
          predicates:
            - Path=/api/notifications/**
          filters:
            - Authentication
        - id: payment-service
          uri: http://payment-service:8088
          predicates:
            - Path=/api/payments/**
          filters:
            - Authentication
        - id: notification-websocket
          uri: http://notification-service:8087
          predicates:
            - Path=/ws/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true